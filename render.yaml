services:
  - type: web
    runtime: node
    name: tejas-backend
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: tejas-db
          property: connectionString

  - type: web
    runtime: static
    name: tejas-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render may suffix "tejas-backend" if that name is taken, so these
      # can't be safely hardcoded here. Set the real values in the
      # Render dashboard (Frontend service -> Environment) after the
      # backend has deployed and you know its actual URL.
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false

databases:
  - name: tejas-db
    plan: free
